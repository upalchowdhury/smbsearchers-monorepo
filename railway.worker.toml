# Railway worker service config (optional reference file)
# Use when creating a separate worker service from the same repo/root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npx tsx src/jobs/worker-entry.ts"
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
