[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dealflow-scraper"
version = "0.1.0"
description = "SMB listing aggregator scraper — three-tier Playwright + browser-use + TinyFish"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.41.0",
    "playwright-stealth>=1.0.6",
    "browser-use>=0.4.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "langchain-openai>=0.1.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
scrape = "run:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
